window:
  size: [1920, 1080]
  fps: 165
  title: "Highrise"

gameplay:
  starting_money: 1000
  max_map_size: 7
  max_building_level: 11
  cloud_count: 30

audio:
  default_music_volume: 1.0
  default_sfx_volume: 1.0

# Sounds of the main actions: manifest keys in config/assets.yaml. Give every age the same
# build sound if you prefer one; every age needs an entry.
action_sounds:
  build:
    wood: build_wood
    rock: build_rock
    sand: build_sand
    stone: build_stone
  next_age: next_age
  sell: sell

# The dust and debris where a sold building stood (pixels in the game world).
sell_effect:
  lifetime_ms: 700
  dust_count: 12           # soft puffs per sale
  debris_count: 16         # small falling chips per sale
  dust_radius: [9, 16]     # a puff's starting radius, min and max
  dust_growth: 1.8         # a puff's radius at the end of its life, times the start
  debris_size: [4, 8]      # a chip's side, min and max
  spread: 85               # most pixels a particle moves sideways
  rise: 50                 # most pixels a puff drifts up
  gravity: 90              # pixels a chip falls over its life
  dust_color: [214, 204, 186]
  debris_colors: [[120, 96, 72], [150, 130, 104], [96, 96, 104], [176, 160, 128]]
  max_bursts: 12           # alive at once

floating_text:
  gain_font_size: 24       # +X$ over a building, pixels at 100% UI scale
  spend_font_size: 30      # -X$ falling from the cash amount, pixels at 100% UI scale
  gain_color: [96, 232, 96]    # +$X over a building that paid or was sold
  spend_color: [255, 90, 80]   # -$X falling from the cash display
  outline_color: [24, 32, 24]
  lifetime_ms: 1400
  rise: 70                 # pixels a gain moves up over its life, at 100% UI scale
  fall: 44                 # pixels a spend moves down over its life, at 100% UI scale
  max_texts: 40            # alive at once

ui:
  cash_roll_ms: 250         # how long a changing digit of the cash amount rolls
  cursor_size: [32, 32]  # the Kenney Cursor Pack sprite's native size: crisp pixel art
  background_colors:
    menu: yellow
    play: yellow
    settings: yellow
    display_settings: yellow
    audio_settings: yellow
    game_settings: yellow
    credits: yellow
    game: [72, 218, 233]
