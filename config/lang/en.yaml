# English strings: the fallback language, and the reference tr.yaml must match
# (same keys, same {placeholders}). Every value is quoted so YAML never turns
# one into a bool or a number. See docs/decisions/0001-localization.md in pygamine.
# _meta.name is shown as is (in capitals, written by hand: no case functions on
# Turkish text) in the Language setting.
_meta:
  name: "ENGLISH"

common:
  go_back: "GO BACK"
  cancel: "CANCEL"
  save: "SAVE"
  enabled: "ON"
  disabled: "OFF"

menu:
  title: "Highrise"
  play: "PLAY"
  settings: "SETTINGS"
  developer: "DEVELOPER"
  exit: "EXIT"

play:
  title: "PLAY"
  new_game: "NEW GAME"
  continue: "CONTINUE"

settings:
  title: "SETTINGS"
  display: "DISPLAY"
  audio: "AUDIO"
  game: "GAME"

display_settings:
  title: "DISPLAY SETTINGS"
  window_mode: "WINDOW MODE"
  window_size: "WINDOW SIZE"
  ui_scale: "UI SCALE"
  reset_ui_scale: "RESET UI SCALE"
  modes:
    fullscreen: "FULLSCREEN"
    borderless: "BORDERLESS"
    windowed: "WINDOWED"

audio_settings:
  title: "AUDIO SETTINGS"
  music_volume: "MUSIC VOLUME"
  sfx_volume: "SFX VOLUME"

game_settings:
  title: "GAME SETTINGS"
  language: "LANGUAGE"
  skip_intro: "SKIP INTRO"

# How an amount of money is written: the cash display shows it as is, and the floating text puts
# a + or - in front. "${amount}" or "${amount:,}" would change every place at once.
money:
  amount: "{amount}$"

game:
  expand: "EXPAND"
  build: "BUILD"
  next_age: "NEXT AGE"
  sell: "SELL"
  max_size: "MAX SIZE"
  tiles_full: "TILES FULL"
  max_age: "MAX AGE"
  level: "Level: {value}"
  speed: "Speed: {value} $/sec"
  cooldown: "Cooldown: {value} sec"
  sell_price: "Sell Price: {value}"

developer:
  title: "Software Engineer"
