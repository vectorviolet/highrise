# Building recipes (DRAFT for the ladder comparison in docs/devlog/2026-11-11-building-recipes.md;
# nothing in the game loads this file yet).
#
# A building sprite is composed from Kenney "Hexagon Buildings" pieces (CC0): floors stacked
# bottom to top, then one roof. Every age uses the same structure per level; only the piece
# prefix differs. Piece file name = prefix + piece, e.g. floor prefix "rock" + "DoorWindow" ->
# rockDoorWindow.png, roof prefix "red" + "Roof" + "Short" -> redRoofShort.png.
#
# The only per-building variety is the door side (left or right), picked when the building is
# first built and kept through every level. A floor kind names its piece for each side; a
# symmetric piece is written once.

pack_piece_size: [65, 89]  # every floor piece, pixels
floor_step: 23             # how far each floor above the first sits higher (the game's own step)
roof_base: 67              # y inside a roof piece that lands on the top floor's top edge

# Prefixes per age. The rock age wears the pack's red roofs on grey walls.
ages:
  wood:  {floor: wood,  roof: wood}
  rock:  {floor: rock,  roof: red}
  sand:  {floor: sand,  roof: sand}
  stone: {floor: stone, roof: stone}

floor_kinds:
  door:                {left: DoorLeft, right: DoorRight}
  door_window:         {left: DoorWindowMirror, right: DoorWindow}
  door_window_blinds:  {left: DoorWindowBlindsMirror, right: DoorWindowBlinds}
  gate:                {left: GateLeft, right: GateRight}
  window:              {left: WindowLeft, right: WindowRight}
  windows:             Windows
  windows_blinds:      WindowBlinds

# Each ladder lists its levels in order. A level is the full stack (`floors` bottom to top, then
# a `roof`) and `adds` is the one visible change from the level before.
ladders:
  # L1: no shutter pieces, so shutters stay free for a later per-building renovation upgrade.
  L1:
    - {floors: [door], roof: Short, adds: "a plain door under a low roof"}
    - {floors: [door_window], roof: Short, adds: "a window beside the door"}
    - {floors: [gate], roof: Short, adds: "the door becomes a wide gate"}
    - {floors: [gate, window], roof: Short, adds: "a second floor with a window"}
    - {floors: [gate, windows], roof: Short, adds: "the second floor gets a second window"}
    - {floors: [gate, windows], roof: Straight, adds: "the roof rises to a point"}
    - {floors: [gate, windows, window], roof: Straight, adds: "a third floor with a window"}
    - {floors: [gate, windows, windows], roof: Straight, adds: "the third floor gets a second window"}
    - {floors: [gate, windows, windows], roof: Tall, adds: "the roof grows taller"}
    - {floors: [gate, windows, windows], roof: Pointy, adds: "the roof becomes a curved spire"}
    - {floors: [gate, windows, windows, windows], roof: Pointy, adds: "a fourth floor"}
  # L2: shutters (blinds) may be level steps too, so the ladder gets longer.
  L2:
    - {floors: [door], roof: Short, adds: "a plain door under a low roof"}
    - {floors: [door_window], roof: Short, adds: "a window beside the door"}
    - {floors: [door_window_blinds], roof: Short, adds: "the window gets shutters"}
    - {floors: [gate], roof: Short, adds: "the door becomes a wide gate"}
    - {floors: [gate, window], roof: Short, adds: "a second floor with a window"}
    - {floors: [gate, windows], roof: Short, adds: "the second floor gets a second window"}
    - {floors: [gate, windows_blinds], roof: Short, adds: "the second floor gets shutters"}
    - {floors: [gate, windows_blinds], roof: Straight, adds: "the roof rises to a point"}
    - {floors: [gate, windows_blinds, window], roof: Straight, adds: "a third floor with a window"}
    - {floors: [gate, windows_blinds, windows], roof: Straight, adds: "the third floor gets a second window"}
    - {floors: [gate, windows_blinds, windows_blinds], roof: Straight, adds: "the third floor gets shutters"}
    - {floors: [gate, windows_blinds, windows_blinds], roof: Tall, adds: "the roof grows taller"}
    - {floors: [gate, windows_blinds, windows_blinds], roof: Pointy, adds: "the roof becomes a curved spire"}
    - {floors: [gate, windows_blinds, windows_blinds, windows], roof: Pointy, adds: "a fourth floor"}
