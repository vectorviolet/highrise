fonts:
    titillium:       {folder: , name: TitilliumWeb-Regular}
    titillium_bold:  {folder: , name: TitilliumWeb-Bold}
    titillium_black: {folder: , name: TitilliumWeb-Black}
images:
    cursor:         { folder: gui/cursor, name: cursor }
    grey_panel:     { folder: gui/panels, name: grey }

    blue_button:    {folder: gui/Blue/Default, name: button_rectangle_depth_gloss}
    green_button:   {folder: gui/Green/Default, name: button_rectangle_depth_gloss}
    yellow_button:  {folder: gui/Yellow/Default, name: button_rectangle_depth_gloss}
    grey_button:    {folder: gui/Grey/Default, name: button_rectangle_depth_gloss}
    blue_circle:    {folder: gui/Blue/Default, name: check_round_color}
    yellow_circle:  {folder: gui/Yellow//Default, name: check_round_color}
    red_button:     {folder: gui/Red//Default, name: button_rectangle_depth_flat}
    grey8:          {folder: gui/Grey/Default, name: button_square_gloss}
    cross_white:    {folder: gui/Grey/Default, name: icon_outline_cross}
    # Logos shipped with pygamine (source: branding), the variants for light pages.
    vv_lockup:      {source: branding, folder: vectorviolet, name: lockup-light-solid}
    github_icon:    {source: branding, folder: github, name: GitHub_Invertocat_Black}
    itch_icon:      {source: branding, folder: itchio/logos, name: itchio-logo-textless-black}
    cross_grey:     {folder: gui/Grey/Default, name: icon_outline_cross}
    
    minus_icon:     {folder: gui/icons, name: minus}
    plus_icon:      {folder: gui/icons, name: plus}
    info_icon:      {folder: gui/icons, name: info}


sounds:
    # Background music: Sakura Girl - Day Off (CC BY 3.0, credited in
    # CREDITS.md). Without a `bg` entry the game plays no music and hides the
    # music volume control.
    bg:             {folder: "", name: bg, extension: mp3}
    click:          {folder: "", name: click-a}
    back:           {folder: "", name: click-b}
    switch_up:      {folder: "", name: switch-b}
    switch_down:    {folder: "", name: switch-a}
    merge:          {folder: "", name: tap-a}
    # Main actions (see action_sounds in config/settings.yaml): one build sound per age.
    build_wood:     {folder: "", name: build-wood}
    build_rock:     {folder: "", name: build-rock}
    build_sand:     {folder: "", name: build-sand}
    build_stone:    {folder: "", name: build-stone}
    next_age:       {folder: "", name: next-age}
    sell:           {folder: "", name: sell}
