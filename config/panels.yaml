      ui_scale_minus_icon:
        extends: minus_icon_template
        position: [850, 585]
      ui_scale_plus_icon:
        extends: plus_icon_template
        position: [1064, 585]
      ui_scale_reset_button:
        extends: menu_btn
        nine_slice: 12  # the 20px border of a menu button needs 40px of height at 80%
        size: [315, 44]
        position: [CENTER, 635]
      ui_scale_reset_button_text:
        extends: menu_btn_text
        parent: ui_scale_reset_button
        font_size: 22
        text_key: display_settings.reset_ui_scale

      display_back_button:
        extends: go_back_btn
        position: [CENTER, 715]
      display_back_button_text:
        extends: go_back_btn_text
        parent: display_back_button

  audio_settings:
    objects:
      audio_settings_title:
        position: [740, 260]
        size: [440, 70]
        asset: blue_button
      audio_settings_title_text:
        parent: audio_settings_title
        type: text
        text_key: audio_settings.title
        font: titillium_black
        font_size: 30
        color: white
        position: [CENTER, CENTER]
      audio_settings_panel:
        position: [740, 320]
        size: [440, 405]
        extends: menu_panel
      # Replaces the panel above when there is no music (the music row is
