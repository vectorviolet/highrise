        extends: volume_button
        position: [840, 445]
      language_plus_button:
        extends: volume_button
        position: [1054, 445]
      language_entry:
        extends: volume_entry
        position: [885, 445]
      language_entry_text:
        extends: volume_entry_text
        parent: language_entry
        font_size: 22
      language_minus_icon:
        extends: minus_icon_template
        position: [850, 455]
      language_plus_icon:
        extends: plus_icon_template
        position: [1064, 455]

      skip_intro_text:
        extends: settings_text
        position: [CENTER, 530]
        text_key: game_settings.skip_intro
      skip_intro_minus_button:
        extends: volume_button
        position: [840, 580]
      skip_intro_plus_button:
        extends: volume_button
        position: [1054, 580]
      skip_intro_entry:
        extends: volume_entry
        position: [885, 580]
      skip_intro_entry_text:
        extends: volume_entry_text
        parent: skip_intro_entry
        font_size: 22
      skip_intro_minus_icon:
        extends: minus_icon_template
        position: [850, 590]
      skip_intro_plus_icon:
        extends: plus_icon_template
        position: [1064, 590]

      game_settings_back_button:
        extends: go_back_btn
        position: [CENTER, 680]
      game_settings_back_button_text:
        extends: go_back_btn_text
        parent: game_settings_back_button

  credits:
    objects:
      credits_title:
        position: [640, 140]
        size: [640, 70]
        asset: blue_button
      credits_title_text:
        parent: credits_title
        type: text
        text_key: credits.title
        font: titillium_black
        font_size: 30
        color: white
        position: [CENTER, CENTER]
      credits_panel:
        extends: menu_panel
        position: [640, 200]
        size: [640, 640]
      # Scrolls its targets up through the panel, clipped to its own rect.
      # Game.open_panel restarts it each time the page opens (content enters
      # from below).
      credits_scroller:
        type: scrolling_panel
        position: [660, 220]
        size: [600, 520]
        speed: 40
        targets:
          - credits_lockup
          - credits_dev_heading
          - credits_dev_1
          - credits_art_heading
          - credits_art_1
          - credits_art_2
          - credits_art_3
          - credits_art_4
          - credits_ui_heading
