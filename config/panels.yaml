object_templates:
  menu_panel:
    asset: grey_panel
    nine_slice: 10
  minus_icon_template:
    asset: minus_icon
    size: [16, 16]
  plus_icon_template:
    asset: plus_icon
    size: [16, 16]
  settings_text:
    type: text
    font: titillium_bold
    font_size: 25
    color: [128, 128, 128]
  panel_text:
    type: text
    font: titillium
    font_size: 17
    color: Black

  # ── Button image templates (image-only — pair with a child text object) ──
  menu_btn:
    asset: blue_button
    hover: yellow_button
    nine_slice: 20
  menu_btn_text:
    type: text
    font: titillium_bold
    font_size: 30
    color: [251, 254, 255]
    position: [CENTER, CENTER]
  # Button colors (issue #63): red leaves/cancels/destroys, green is the main
  # "go" action, blue is everything else. tests/test_menu_polish.py lists them.
  # They repeat menu_btn's hover and nine_slice instead of extending it:
  # pygamine resolves `extends` one level only (pygamine #46), so a template
  # extending a template loses the grandparent's keys.
  menu_btn_red:
    asset: red_button
    hover: yellow_button
    nine_slice: 20
  menu_btn_green:
    asset: green_button
    hover: yellow_button
    nine_slice: 20
  title_btn:
    asset: blue_button
  title_btn_text:
    type: text
    font: titillium_bold
    font_size: 30
    color: white
    position: [CENTER, CENTER]
  bottom_panel_btn_text:
    type: text
    font: titillium_bold
    font_size: 27
    color: White
    position: [CENTER, CENTER]
  go_back_btn:
    size: [315, 60]
    asset: red_button
    hover: yellow_button
  go_back_btn_text:
    type: text
    text_key: common.go_back
    font: titillium_bold
    font_size: 28
    color: White
    position: [CENTER, CENTER]
  # Credits page: a gray heading per section, black entries below it.
  credits_heading:
    type: text
    font: titillium_bold
    font_size: 25
    color: [128, 128, 128]
  credits_entry:
    type: text
    font: titillium
    font_size: 22
    color: Black
  volume_entry:
    size: [150, 35]
    asset: grey8
  volume_entry_text:
    type: text
    font: titillium
    font_size: 25
    color: [100, 100, 100]
    text: ""
    position: [CENTER, CENTER]
  volume_button:
    size: [36, 36]
    asset: blue_circle
    hover: yellow_circle

panels:
  menu:
    objects:
      menu_title:
        position: [740, 320]
        size: [440, 70]
        asset: blue_button
      menu_title_text:
        parent: menu_title
        type: text
        text_key: menu.title
        font: titillium_black
        font_size: 30
        color: white
        position: [CENTER, CENTER]
      menu_panel:
        extends: menu_panel
        position: [740, 380]
        size: [440, 380]
      menu_buttons:
        parent: menu_panel
        layout: { direction: vertical, start: [20, 30], spacing: 80 }
        objects:
          play_button:      { extends: menu_btn_green, size: [400, 60] }
          settings_button:  { extends: menu_btn, size: [400, 60] }
          credits_button:   { extends: menu_btn, size: [400, 60] }
          exit_button:      { extends: menu_btn_red, size: [400, 60], on_click_sound: back }
      play_button_text:      { extends: menu_btn_text, parent: play_button,      text_key: menu.play }
      settings_button_text:  { extends: menu_btn_text, parent: settings_button,  text_key: menu.settings }
      credits_button_text:   { extends: menu_btn_text, parent: credits_button,   text_key: menu.credits }
      exit_button_text:      { extends: menu_btn_text, parent: exit_button,      text_key: menu.exit }

  settings:
    objects:
      settings_title:
        position: [740, 320]
        size: [440, 70]
        asset: blue_button
      settings_title_text:
        parent: settings_title
        type: text
        text_key: settings.title
        font: titillium_black
        font_size: 30
        color: white
        position: [CENTER, CENTER]
      settings_panel:
        extends: menu_panel
        position: [740, 380]
        size: [440, 370]
      settings_buttons:
        parent: settings_panel
        layout: { direction: vertical, start: [20, 30], spacing: 80 }
        objects:
          display_settings_button: { extends: menu_btn, size: [400, 60] }
          audio_settings_button:   { extends: menu_btn, size: [400, 60] }
          game_settings_button:    { extends: menu_btn, size: [400, 60] }
      settings_back_button:
        extends: go_back_btn
        parent: settings_panel
        position: [CENTER, 270]
      display_settings_button_text: { extends: menu_btn_text, parent: display_settings_button, text_key: settings.display }
      audio_settings_button_text:   { extends: menu_btn_text, parent: audio_settings_button,   text_key: settings.audio }
      game_settings_button_text:    { extends: menu_btn_text, parent: game_settings_button,    text_key: settings.game }
      settings_back_button_text:    { extends: go_back_btn_text, parent: settings_back_button }

  play:
    objects:
      play_title:
        position: [740, 320]
        size: [440, 70]
        asset: blue_button
      play_title_text:
        parent: play_title
        type: text
        text_key: play.title
        font: titillium_black
        font_size: 30
        color: white
        position: [CENTER, CENTER]
      play_panel:
        extends: menu_panel
        position: [740, 380]
        size: [440, 290]
      play_buttons:
        parent: play_panel
        layout: { direction: vertical, start: [20, 30], spacing: 80 }
        objects:
          continue_button: { extends: menu_btn_green, size: [400, 60] }
          new_game_button: { extends: menu_btn, size: [400, 60] }
          play_back_button: { extends: menu_btn_red, size: [400, 60] }
      continue_button_text:  { extends: menu_btn_text, parent: continue_button,  text_key: play.continue }
      new_game_button_text:  { extends: menu_btn_text, parent: new_game_button,  text_key: play.new_game }
      play_back_button_text: { extends: menu_btn_text, parent: play_back_button, text_key: common.go_back }

  game:
    objects:
      # The bottom bar hugs the bottom edge at every UI scale. The background is
      # wider than any canvas so it still spans it when the UI scale shrinks it;
      # the toolbar sits on a transparent 1920x100 root, so its children keep
      # their authored offsets and scale about the bar's own origin.
      game_panel:
        anchor: bottom
        position: [0, -15]
        size: [3200, 100]
        extends: menu_panel
      game_toolbar:
        anchor: bottom
        position: [0, -15]
        size: [1920, 100]
        color: [0, 0, 0, 0]
      selection_mode_button:
        parent: game_toolbar
        position: [340, 20]
        size: [60, 60]
        asset: green_button
        hover: yellow_button
        states:
          "on":  { asset: green_button, hover: yellow_button }
          "off": { asset: red_button,   hover: yellow_button }
      selection_mode_button_image:
        parent: game_toolbar
        position: [345, 25]
        size: [50, 50]
        asset: info_icon

      expand_button:
        parent: game_toolbar
        position: [440, 20]
        size: [200, 60]
        asset: blue_button
        hover: yellow_button
      expand_button_text:
        extends: bottom_panel_btn_text
        parent: expand_button
        text_key: game.expand
        states:
          hover: "0$"
      build_button:
        parent: game_toolbar
        position: [660, 20]
        size: [200, 60]
        asset: green_button
        hover: yellow_button
      build_button_text:
        extends: bottom_panel_btn_text
        parent: build_button
        text_key: game.build
        states:
          hover: "0$"
      boost_button:
        parent: game_toolbar
        position: [880, 20]
        size: [200, 60]
        asset: green_button
        hover: yellow_button
      boost_button_text:
        extends: bottom_panel_btn_text
        parent: boost_button
        text_key: game.boost
        states:
          hover: "0$"
      next_age_button:
        parent: game_toolbar
        position: [1100, 20]
        size: [200, 60]
        asset: green_button
        hover: yellow_button
      next_age_button_text:
        extends: bottom_panel_btn_text
        parent: next_age_button
        text_key: game.next_age
        states:
          hover: "0$"

      # The cash display: same top, height and bottom line as the buttons (y 20,
      # height 60). The plate image and the coin are painted by ui/cash_display.py;
      # the amount is right-aligned inside the plate.
      money_panel:
        parent: game_toolbar
        position: [1420, 20]
        size: [280, 60]
        asset: grey_button
      money_icon:
        parent: money_panel
        position: [14, 10]
        size: [40, 40]
        color: [0, 0, 0, 0]  # empty: the coin is drawn in code
      money_text:
        type: text
        font: titillium_bold
        font_size: 32
        color: White
        parent: money_panel
        anchor: right
        position: [-18, -2]
        text: ""

      info_panel:
        position: [CENTER, CENTER]
        size: [300, 460]
        extends: menu_panel
      info_panel_building_image:
        # The board's sprite at 1.2x, so the tallest building (level 11, 154 px in the world)
        # fits: 154 * 1.2 = 185 tall, 50 * 1.2 = 60 wide. Every building's roof tip is at the top.
        position: [830, 330]
        size: [60, 185]
      sell_button:
        position: [CENTER, 690]
        size: [210, 50]
        asset: red_button
        hover: yellow_button
        # No on_click_sound: Game._sell plays the sell sound.
      sell_button_text:
        type: text
        font: titillium_bold
        font_size: 28
        color: White
        position: [CENTER, CENTER]
        parent: sell_button
        text_key: game.sell
        states:
          hover: "0$"
      close_button:
        position: [1070, 315]
        size: [38, 38]
        asset: red_button
        hover: yellow_button
        on_click_sound: back
      level_text: { extends: panel_text, position: [925, 322], text_key: game.level, text_params: { value: "" } }
      speed_text: { extends: panel_text, position: [925, 342], text_key: game.speed, text_params: { value: "" } }
      # A booster's info panel shows this line instead of the speed and cooldown.
      boost_text: { extends: panel_text, position: [925, 342], text_key: game.booster_multiplier, text_params: { value: "" } }
      cooldown_text: { extends: panel_text, position: [925, 362], text_key: game.cooldown, text_params: { value: "" } }
      sell_price_text: { extends: panel_text, position: [925, 382], text_key: game.sell_price, text_params: { value: "" } }

