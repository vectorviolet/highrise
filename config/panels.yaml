      cancel_button:
        position: [805, 635]
        size: [150, 60]
        asset: red_button
        hover: yellow_button
        on_click_sound: back
      cancel_button_text:
        type: text
        font: titillium_bold
        font_size: 28
        color: White
        position: [CENTER, CENTER]
        parent: cancel_button
