      audio_settings_panel_no_music:
        position: [740, 320]
        size: [440, 320]
        extends: menu_panel
      master_volume_text:
        extends: settings_text
        position: [CENTER, 345]
        text_key: audio_settings.master_volume
      music_volume_text:
        extends: settings_text
        position: [CENTER, 430]
        text_key: audio_settings.music_volume
      sfx_volume_text:
        extends: settings_text
        position: [CENTER, 515]
        text_key: audio_settings.sfx_volume

      master_volume_minus_button:
        extends: volume_button
        position: [840, 390]
      master_volume_plus_button:
        extends: volume_button
        position: [1054, 390]
      master_volume_entry:
        extends: volume_entry
        position: [885, 390]
      master_volume_entry_text:
        extends: volume_entry_text
        parent: master_volume_entry
      master_volume_minus_icon:
        extends: minus_icon_template
        position: [850, 400]
      master_volume_plus_icon:
        extends: plus_icon_template
        position: [1064, 400]

      music_volume_minus_button:
        extends: volume_button
        position: [840, 475]
      music_volume_plus_button:
        extends: volume_button
        position: [1054, 475]
      music_volume_entry:
        extends: volume_entry
        position: [885, 475]
      music_volume_entry_text:
        extends: volume_entry_text
