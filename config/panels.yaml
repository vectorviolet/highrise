object_templates:
  menu_panel:
    asset: grey_panel
    nine_slice: 10
  minus_icon_template:
    asset: minus_icon
    size: [16, 16]
  plus_icon_template:
    asset: plus_icon
    size: [16, 16]
  settings_text:
    type: text
    font: titillium_bold
    font_size: 25
    color: [128, 128, 128]
  panel_text:
    type: text
    font: titillium
    font_size: 17
    color: Black

  # ── Button image templates (image-only — pair with a child text object) ──
  menu_btn:
    asset: blue_button
    hover: yellow_button
    nine_slice: 20
  menu_btn_text:
    type: text
    font: titillium_bold
    font_size: 30
    color: [251, 254, 255]
    position: [CENTER, CENTER]
  title_btn:
    asset: blue_button
  title_btn_text:
    type: text
    font: titillium_bold
    font_size: 30
    color: white
    position: [CENTER, CENTER]
  bottom_panel_btn_text:
    type: text
    font: titillium_bold
    font_size: 27
    color: White
    position: [CENTER, CENTER]
  go_back_btn:
    size: [315, 60]
    asset: red_button
    hover: yellow_button
  go_back_btn_text:
    type: text
    text_key: common.go_back
    font: titillium_bold
    font_size: 28
    color: White
    position: [CENTER, CENTER]
  volume_entry:
    size: [150, 35]
    asset: grey8
  volume_entry_text:
    type: text
    font: titillium
    font_size: 25
    color: [100, 100, 100]
    text: ""
    position: [CENTER, CENTER]
  volume_button:
    size: [36, 36]
    asset: blue_circle
    hover: yellow_circle

panels:
  menu:
    objects:
      menu_title:
        position: [740, 320]
        size: [440, 70]
        asset: blue_button
      menu_title_text:
        parent: menu_title
        type: text
        text_key: menu.title
        font: titillium_black
        font_size: 30
        color: white
        position: [CENTER, CENTER]
      menu_panel:
        extends: menu_panel
        position: [740, 380]
        size: [440, 380]
      menu_buttons:
        parent: menu_panel
        layout: { direction: vertical, start: [20, 30], spacing: 80 }
        objects:
          play_button:      { extends: menu_btn, size: [400, 60] }
          settings_button:  { extends: menu_btn, size: [400, 60] }
          developer_button: { extends: menu_btn, size: [400, 60] }
          exit_button:      { extends: menu_btn, size: [400, 60], on_click_sound: back }
      play_button_text:      { extends: menu_btn_text, parent: play_button,      text_key: menu.play }
      settings_button_text:  { extends: menu_btn_text, parent: settings_button,  text_key: menu.settings }
      developer_button_text: { extends: menu_btn_text, parent: developer_button, text_key: menu.developer }
      exit_button_text:      { extends: menu_btn_text, parent: exit_button,      text_key: menu.exit }

  settings:
    objects:
      settings_title:
        position: [740, 320]
        size: [440, 70]
        asset: blue_button
      settings_title_text:
        parent: settings_title
        type: text
        text_key: settings.title
        font: titillium_black
        font_size: 30
        color: white
        position: [CENTER, CENTER]
      settings_panel:
        extends: menu_panel
        position: [740, 380]
        size: [440, 370]
      settings_buttons:
        parent: settings_panel
        layout: { direction: vertical, start: [20, 30], spacing: 80 }
        objects:
          display_settings_button: { extends: menu_btn, size: [400, 60] }
          audio_settings_button:   { extends: menu_btn, size: [400, 60] }
          game_settings_button:    { extends: menu_btn, size: [400, 60] }
          settings_back_button:    { extends: menu_btn, size: [400, 60] }
      display_settings_button_text: { extends: menu_btn_text, parent: display_settings_button, text_key: settings.display }
      audio_settings_button_text:   { extends: menu_btn_text, parent: audio_settings_button,   text_key: settings.audio }
      game_settings_button_text:    { extends: menu_btn_text, parent: game_settings_button,    text_key: settings.game }
      settings_back_button_text:    { extends: menu_btn_text, parent: settings_back_button,    text_key: common.go_back }

  play:
    objects:
      play_title:
        position: [740, 320]
        size: [440, 70]
        asset: blue_button
      play_title_text:
        parent: play_title
        type: text
        text_key: play.title
        font: titillium_black
        font_size: 30
        color: white
        position: [CENTER, CENTER]
      play_panel:
        extends: menu_panel
        position: [740, 380]
        size: [440, 290]
      play_buttons:
        parent: play_panel
        layout: { direction: vertical, start: [20, 30], spacing: 80 }
        objects:
          new_game_button: { extends: menu_btn, size: [400, 60] }
          continue_button: { extends: menu_btn, size: [400, 60] }
          play_back_button: { extends: menu_btn, size: [400, 60] }
      new_game_button_text:  { extends: menu_btn_text, parent: new_game_button,  text_key: play.new_game }
      continue_button_text:  { extends: menu_btn_text, parent: continue_button,  text_key: play.continue }
      play_back_button_text: { extends: menu_btn_text, parent: play_back_button, text_key: common.go_back }

  game:
    objects:
      # The bottom bar hugs the bottom edge at every UI scale. The background is
      # wider than any canvas so it still spans it when the UI scale shrinks it;
      # the toolbar sits on a transparent 1920x100 root, so its children keep
      # their authored offsets and scale about the bar's own origin.
      game_panel:
        anchor: bottom
        position: [0, -15]
        size: [3200, 100]
        extends: menu_panel
      game_toolbar:
        anchor: bottom
        position: [0, -15]
        size: [1920, 100]
        color: [0, 0, 0, 0]
      selection_mode_button:
        parent: game_toolbar
        position: [340, 20]
        size: [60, 60]
        asset: green_button
        hover: yellow_button
        states:
          "on":  { asset: green_button, hover: yellow_button }
          "off": { asset: red_button,   hover: yellow_button }
      selection_mode_button_image:
        parent: game_toolbar
        position: [345, 25]
        size: [50, 50]
        asset: info_icon

      expand_button:
        parent: game_toolbar
        position: [560, 20]
        size: [200, 60]
        asset: blue_button
        hover: yellow_button
      expand_button_text:
        extends: bottom_panel_btn_text
        parent: expand_button
        text_key: game.expand
        states:
          hover: "0$"
      build_button:
        parent: game_toolbar
        position: [860, 20]
        size: [200, 60]
        asset: green_button
        hover: yellow_button
      build_button_text:
        extends: bottom_panel_btn_text
        parent: build_button
        text_key: game.build
        states:
          hover: "0$"
      next_age_button:
        parent: game_toolbar
        position: [1160, 20]
        size: [200, 60]
        asset: green_button
        hover: yellow_button
      next_age_button_text:
        extends: bottom_panel_btn_text
        parent: next_age_button
        text_key: game.next_age
        states:
          hover: "0$"

      money_text:
        type: text
        font: titillium_bold
        font_size: 35
        color: Green
        background_color: Black
        padding: [6, 16]
        parent: game_toolbar
        position: [1450, 30]
        text: ""

      info_panel:
        position: [CENTER, CENTER]
        size: [300, 460]
        extends: menu_panel
      info_panel_building_image:
        position: [830, 340]
        size: [65, 89]
      sell_button:
        position: [CENTER, 690]
        size: [210, 50]
        asset: green_button
        hover: red_button
        on_click_sound: back
      sell_button_text:
        type: text
        font: titillium_bold
        font_size: 28
        color: White
        position: [CENTER, CENTER]
        parent: sell_button
        text_key: game.sell
        states:
          hover: "0$"
      close_button:
        position: [1070, 315]
        size: [38, 38]
        asset: red_button
        hover: yellow_button
        on_click_sound: back
      level_text: { extends: panel_text, position: [925, 390], text_key: game.level, text_params: { value: "" } }
      speed_text: { extends: panel_text, position: [925, 410], text_key: game.speed, text_params: { value: "" } }
      cooldown_text: { extends: panel_text, position: [925, 430], text_key: game.cooldown, text_params: { value: "" } }
      sell_price_text: { extends: panel_text, position: [925, 450], text_key: game.sell_price, text_params: { value: "" } }

  display_settings:
    objects:
      display_settings_title:
        position: [740, 275]
        size: [440, 70]
        asset: blue_button
      display_settings_title_text:
        parent: display_settings_title
        type: text
        text_key: display_settings.title
        font: titillium_black
        font_size: 30
        color: white
        position: [CENTER, CENTER]
      display_settings_panel:
        position: [740, 335]
        size: [440, 470]
        extends: menu_panel

      window_mode_text:
        extends: settings_text
        position: [CENTER, 360]
        text_key: display_settings.window_mode
      window_mode_minus_button:
        extends: volume_button
        position: [840, 405]
      window_mode_plus_button:
        extends: volume_button
        position: [1054, 405]
      window_mode_entry:
        extends: volume_entry
        position: [885, 405]
      window_mode_entry_text:
        extends: volume_entry_text
        parent: window_mode_entry
        font_size: 16
        text: ""
      window_mode_minus_icon:
        extends: minus_icon_template
        position: [850, 415]
      window_mode_plus_icon:
        extends: plus_icon_template
        position: [1064, 415]

      window_size_text:
        extends: settings_text
        position: [CENTER, 445]
        text_key: display_settings.window_size
      window_size_minus_button:
        extends: volume_button
        position: [840, 490]
      window_size_plus_button:
        extends: volume_button
        position: [1054, 490]
      window_size_entry:
        extends: volume_entry
        position: [885, 490]
      window_size_entry_text:
        extends: volume_entry_text
        parent: window_size_entry
        font_size: 18
        text: ""
      window_size_minus_icon:
        extends: minus_icon_template
        position: [850, 500]
      window_size_plus_icon:
        extends: plus_icon_template
        position: [1064, 500]

      ui_scale_text:
        extends: settings_text
        position: [CENTER, 530]
        text_key: display_settings.ui_scale
      ui_scale_minus_button:
        extends: volume_button
        position: [840, 575]
      ui_scale_plus_button:
        extends: volume_button
        position: [1054, 575]
      ui_scale_entry:
        extends: volume_entry
        position: [885, 575]
      ui_scale_entry_text:
        extends: volume_entry_text
        parent: ui_scale_entry
        font_size: 18
        text: ""
      ui_scale_minus_icon:
        extends: minus_icon_template
        position: [850, 585]
      ui_scale_plus_icon:
        extends: plus_icon_template
        position: [1064, 585]
      ui_scale_reset_button:
        extends: menu_btn
        nine_slice: 12  # the 20px border of a menu button needs 40px of height at 80%
        size: [315, 44]
        position: [CENTER, 635]
      ui_scale_reset_button_text:
        extends: menu_btn_text
        parent: ui_scale_reset_button
        font_size: 22
        text_key: display_settings.reset_ui_scale

      display_back_button:
        extends: go_back_btn
        position: [810, 715]
      display_back_button_text:
        extends: go_back_btn_text
        parent: display_back_button

  audio_settings:
    objects:
      audio_settings_title:
        position: [740, 260]
        size: [440, 70]
        asset: blue_button
      audio_settings_title_text:
        parent: audio_settings_title
        type: text
        text_key: audio_settings.title
        font: titillium_black
        font_size: 30
        color: white
        position: [CENTER, CENTER]
      audio_settings_panel:
        position: [740, 320]
        size: [440, 500]
        extends: menu_panel
      music_volume_text:
        extends: settings_text
        position: [CENTER, 380]
        text_key: audio_settings.music_volume
      sfx_volume_text:
        extends: settings_text
        position: [CENTER, 550]
        text_key: audio_settings.sfx_volume

      music_volume_minus_button:
        extends: volume_button
        position: [840, 430]
      music_volume_plus_button:
        extends: volume_button
        position: [1054, 430]
      music_volume_entry:
        extends: volume_entry
        position: [885, 430]
      music_volume_entry_text:
        extends: volume_entry_text
        parent: music_volume_entry
      music_volume_minus_icon:
        extends: minus_icon_template
        position: [850, 440]
      music_volume_plus_icon:
        extends: plus_icon_template
        position: [1064, 440]

      sfx_volume_minus_button:
        extends: volume_button
        position: [840, 600]
      sfx_volume_plus_button:
        extends: volume_button
        position: [1054, 600]
      sfx_volume_entry:
        extends: volume_entry
        position: [885, 600]
      sfx_volume_entry_text:
        extends: volume_entry_text
        parent: sfx_volume_entry
      sfx_volume_minus_icon:
        extends: minus_icon_template
        position: [850, 610]
      sfx_volume_plus_icon:
        extends: plus_icon_template
        position: [1064, 610]

      cancel_button:
        position: [810, 710]
        size: [150, 60]
        asset: red_button
        hover: yellow_button
        on_click_sound: back
      cancel_button_text:
        type: text
        font: titillium_bold
        font_size: 28
        color: White
        position: [CENTER, CENTER]
        parent: cancel_button
        text_key: common.cancel
      save_button:
        position: [975, 710]
        size: [150, 60]
        asset: green_button
        hover: yellow_button
        on_click_sound: back
      save_button_text:
        type: text
        font: titillium_bold
        font_size: 28
        color: White
        position: [CENTER, CENTER]
        parent: save_button
        text_key: common.save

  game_settings:
    objects:
      game_settings_title:
        position: [740, 300]
        size: [440, 70]
        asset: blue_button
      game_settings_title_text:
        parent: game_settings_title
        type: text
        text_key: game_settings.title
        font: titillium_black
        font_size: 30
        color: white
        position: [CENTER, CENTER]
      game_settings_panel:
        position: [740, 360]
        size: [440, 400]
        extends: menu_panel

      language_text:
        extends: settings_text
        position: [CENTER, 395]
        text_key: game_settings.language
      language_minus_button:
        extends: volume_button
        position: [840, 445]
      language_plus_button:
        extends: volume_button
        position: [1054, 445]
      language_entry:
        extends: volume_entry
        position: [885, 445]
      language_entry_text:
        extends: volume_entry_text
        parent: language_entry
        font_size: 22
      language_minus_icon:
        extends: minus_icon_template
        position: [850, 455]
      language_plus_icon:
        extends: plus_icon_template
        position: [1064, 455]

      skip_intro_text:
        extends: settings_text
        position: [CENTER, 530]
        text_key: game_settings.skip_intro
      skip_intro_minus_button:
        extends: volume_button
        position: [840, 580]
      skip_intro_plus_button:
        extends: volume_button
        position: [1054, 580]
      skip_intro_entry:
        extends: volume_entry
        position: [885, 580]
      skip_intro_entry_text:
        extends: volume_entry_text
        parent: skip_intro_entry
        font_size: 22
      skip_intro_minus_icon:
        extends: minus_icon_template
        position: [850, 590]
      skip_intro_plus_icon:
        extends: plus_icon_template
        position: [1064, 590]

      game_settings_back_button:
        extends: go_back_btn
        position: [810, 680]
      game_settings_back_button_text:
        extends: go_back_btn_text
        parent: game_settings_back_button

  developer:
    objects:
      developer_panel:
        position: [CENTER, CENTER]
        size: [300, 380]
        extends: menu_panel
      profile_image:
        position: [CENTER, 370]
        size: [100, 100]
        asset: profile_image
      name_text:
        type: text
        font: titillium_bold
        color: Black
        font_size: 20
        position: [CENTER, 480]
        text: "Umutcan Ekinci"
      title_text:
        type: text
        font: titillium_bold
        color: [128, 128, 128]
        font_size: 17
        position: [CENTER, 500]
        text_key: developer.title
      github_button:
        position: [CENTER, 550]
        size: [250, 40]
        asset: grey_button
        hover: yellow_button
      github_button_text:
        type: text
        font: titillium_bold
        font_size: 20
        color: Black
        position: [CENTER, CENTER]
        parent: github_button
        text: ""
        states:
          hover: "github.com/umutcanekinci"
      github_icon:
        position: [940, 555]
        size: [16, 16]
        asset: github_icon
      itch_button:
        position: [CENTER, 600]
        size: [250, 40]
        asset: grey_button
        hover: yellow_button
      itch_button_text:
        type: text
        font: titillium_bold
        font_size: 20
        color: Black
        position: [CENTER, CENTER]
        parent: itch_button
        text: ""
        states:
          hover: "umutcanekinci.itch.io"
      itch_icon:
        position: [939, 605]
        size: [18, 16]
        asset: itch_icon
      developer_back_button:
        extends: go_back_btn
        size: [250, 40]
        position: [CENTER, 650]
      developer_back_button_text:
        extends: go_back_btn_text
        parent: developer_back_button
        font_size: 28
        color: Black