# Where every file under assets/ comes from -- see README.md ("Asset sources").
# tests/test_sources.py keeps this complete, and scripts/gen_credits.py builds
# CREDITS.md's asset section from it. A pack's license text is in
# licenses/assets/<pack>.txt.
#
# source: a pack slug from `packs`, or "own" (made for this game).
# original: the file's path inside that pack.
# composited_from: pack tiles combined into one image (instead of `original`).
# modified: what was changed, for edited pack files.
# generated_with: for `own` files made with an AI tool; CREDITS.md says so instead of "made by hand".

packs:
  font-titillium-web:
    name: "Titillium Web"
    author: "Accademia di Belle Arti di Urbino"
    url: https://fonts.google.com/specimen/Titillium+Web
    license: OFL-1.1
    used_for: "all text: Regular, Bold and Black"
  kenney-background-elements-remastered:
    name: "Background Elements Remastered"
    author: Kenney
    url: https://kenney.nl/assets/background-elements-remastered
    license: CC0-1.0
    used_for: "clouds"
  kenney-cursor-pack:
    name: "Cursor Pack"
    author: Kenney
    url: https://kenney.nl/assets/cursor-pack
    license: CC0-1.0
    used_for: "mouse cursor"
  kenney-game-icons:
    name: "Game Icons"
    author: Kenney
    url: https://kenney.nl/assets/game-icons
    license: CC0-1.0
    used_for: "info, plus and minus icons"
  kenney-hexagon-buildings:
    name: "Hexagon Buildings"
    author: Kenney
    url: https://kenney.nl/assets/hexagon-buildings
    license: CC0-1.0
    used_for: "buildings"
  kenney-impact-sounds:
    name: "Impact Sounds"
    author: Kenney
    url: https://kenney.nl/assets/impact-sounds
    license: CC0-1.0
    used_for: "build sounds"
  kenney-interface-sounds:
    name: "Interface Sounds"
    author: Kenney
    url: https://kenney.nl/assets/interface-sounds
    license: CC0-1.0
    used_for: "NEXT AGE sound"
  kenney-isometric-landscape:
    name: "Isometric Landscape"
    author: Kenney
    url: https://kenney.nl/assets/isometric-tiles-landscape
    license: CC0-1.0
    used_for: "ground tile"
  kenney-sci-fi-sounds:
    name: "Sci-Fi Sounds"
    author: Kenney
    url: https://kenney.nl/assets/sci-fi-sounds
    license: CC0-1.0
    used_for: "sell sound"
  kenney-ui-pack:
    name: "UI Pack"
    author: Kenney
    url: https://kenney.nl/assets/ui-pack
    license: CC0-1.0
    used_for: "buttons, panel backgrounds, sounds"
  music-sakura-girl-day-off:
    name: "Day Off"
    author: "Sakura Girl"
    url: https://soundcloud.com/sakuragirl_official/dayoff
    license: CC-BY-3.0
    used_for: "menu and in-game music"
    license_check: "The track's SoundCloud page (the url above) lists its license as CC BY 3.0; the owner verified this on 2026-11-04. The file itself comes from the artist's free Hypeddit download, https://hypeddit.com/sakuragirl/dayoff."

