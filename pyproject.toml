[project]
name = "highrise"
version = "0.2.4"
requires-python = ">=3.12"
dependencies = [
    "pygame-ce",
    "pyyaml",
    "pygamine",
]

[dependency-groups]
# Tooling for producing distributable builds (see highrise.spec / CI).
build = [
    "pyinstaller>=6.0",
]
dev = ["pytest>=8", "pytest-cov>=5", "ruff==0.17.2"]

[tool.ruff]
# ruff's own default, written out: both `ruff check` and `ruff format` use it.
line-length = 88
# The pygamine submodule has its own ruff configuration and CI.
extend-exclude = ["src/pygamine"]

[tool.ruff.format]
# Black-compatible formatting; Black's defaults throughout.
quote-style = "double"

[tool.ruff.lint]
# Deliberately narrow, like pygamine's: F (pyflakes -- real bugs such as
# unused imports or undefined names), not pycodestyle's style rules.
# PLR6301 (no-self-use): a method that doesn't use `self` should be a static
# method or a module-level function. It's a preview rule; `preview = true` with
# `explicit-preview-rules = true` turns on only the preview rules selected by
# their full code here, not every preview rule or preview behaviour.
select = ["F", "ANN201", "ANN202", "ANN204", "ANN205", "ANN206", "PLR6301"]
preview = true
explicit-preview-rules = true

[tool.ruff.lint.per-file-ignores]
# Every function and method in the source code declares its return type (the
# ANN rules above). Test functions don't: pytest calls them and no type checker
# runs here. Fixtures and helpers in tests that return a value still get one.
"tests/**" = ["ANN201", "ANN202", "ANN204", "ANN205", "ANN206"]

[tool.uv.sources]
pygamine = { path = "src/pygamine", editable = true }

[tool.pytest.ini_options]
# Puts src/ + src/pygamine on sys.path so tests can `import app.game` /
# `import gameplay.*` etc. without per-file path hacks (mirrors __main__.py).
pythonpath = ["src", "src/pygamine"]
testpaths = ["tests"]

[tool.coverage.run]
# pygamine is a vendored submodule with its own separate test suite
# (engine-tests in CI) -- the coverage badge should reflect only this app's
# own code. Listed as explicit leaf directories rather than "src" itself:
# coverage.py's static discovery of *unexecuted* files (needed so untested
# modules show as 0% instead of being silently excluded from the total)
# doesn't reliably recurse into subdirectories of a single top-level entry.
source = [
    "src/app",
    "src/domain",
    "src/gameplay",
    "src/gameplay/buildings",
    "src/gameplay/clouds",
    "src/gameplay/tiles",
    "src/ui",
    "src/util",
]
