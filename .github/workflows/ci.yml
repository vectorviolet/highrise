name: CI

# Runs on GitHub's servers AFTER code arrives there:
#   * every push to any branch except the merge queue's own
#   * every pull request targeting main
#   * every merge-queue group (merge_group) before it lands on main
# Runs the pygamine engine's own test suite (vendored as a submodule, but
# nothing previously exercised it here), this app's own game-logic tests
# (tests/), and a smoke test that the app itself still boots headlessly.
# Deliberately separate from release.yml, which only builds/publishes on
# version tags.
on:
  push:
    # The merge queue's temporary branches already get a merge_group run; a
    # second push run there duplicates (or, with a concurrency group, cancels)
    # it, and the queue drops the PR for failed checks.
    branches-ignore: ["gh-readonly-queue/**"]
  pull_request:
    branches: [main]
  # Required checks must also run on merge-queue groups.
  merge_group:

# Keyed on the event too, so a run for one event never cancels another's.
# Runs on main are never cancelled: each merged commit needs its own CI
# status and badge publish, even when the queue merges PRs back to back.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Lint and format (ruff)
    runs-on: ubuntu-latest
    steps:
      # With the submodule: `uv run` builds the project environment, which
      # installs pygamine from src/pygamine (ruff itself skips that folder).
      - name: Checkout (with pygamine submodule)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up uv + Python
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Lint (ruff check)
        run: uv run --group dev ruff check .

      - name: Format (ruff, Black-compatible)
        run: uv run --group dev ruff format --check .

  engine-tests:
    name: pygamine test suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with pygamine submodule)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up uv + Python
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Run pytest
        working-directory: src/pygamine
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: uv run --group dev pytest -q

  app-tests:
    name: App game-logic test suite
    runs-on: ubuntu-latest
    permissions:
      contents: write  # only this job pushes the coverage badge (to the badges branch)
    steps:
      - name: Checkout (with pygamine submodule)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up uv + Python
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Run pytest with coverage
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: uv run --group dev pytest -q --cov --cov-report=json --cov-report=term

      # Only on a push to main -- never on PRs or merge_group runs. The badge
      # lives on the orphan `badges` branch, not on main: main's ruleset
      # (PR required, no bypass) rejects direct pushes from CI.
      - name: Update coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: uv run pygamine-coverage-badge

      - name: Publish badge to the badges branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        # Plain git plumbing inside this checkout (so the token actions/checkout
        # configured is reused): one commit on top of `badges`, or a new
        # orphan root commit if the branch doesn't exist yet.
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          blob=$(git hash-object -w .github/badges/coverage.json)
          msg="Update coverage badge for ${GITHUB_SHA::7}"
          if git fetch --depth=1 origin badges; then
            parent=$(git rev-parse FETCH_HEAD)
            if [ "$(git rev-parse -q --verify "$parent:coverage.json" || true)" = "$blob" ]; then
              echo "Badge unchanged; nothing to publish."
              exit 0
            fi
            tree=$({ git ls-tree "$parent" | awk -F'\t' '$2 != "coverage.json"'
                     printf '100644 blob %s\tcoverage.json\n' "$blob"; } | git mktree)
            commit=$(git commit-tree "$tree" -p "$parent" -m "$msg")
          else
            readme=$(printf '# badges\n\nGenerated by CI; never merged.\n' | git hash-object -w --stdin)
            tree=$(printf '100644 blob %s\tREADME.md\n100644 blob %s\tcoverage.json\n' \
                   "$readme" "$blob" | git mktree)
            commit=$(git commit-tree "$tree" -m "$msg")
          fi
          git push origin "$commit:refs/heads/badges"

  app-smoke-test:
    name: App smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with pygamine submodule)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up uv + Python
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Boot the game headlessly on every panel
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: uv run python scripts/smoke_test.py
