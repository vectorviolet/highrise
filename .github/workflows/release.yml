name: Release

# Build per-OS bundles and publish them to a GitHub Release; the browser (pygbag)
# bundle is built and published by its own jobs (web, publish-web, attach-web).
# Cut a release by pushing a tag:  git tag v0.1.0 && git push origin v0.1.0
# Use "Run workflow" (workflow_dispatch) to build without releasing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: highrise-windows.zip
          - os: macos-latest
            asset: highrise-macos.zip
          - os: ubuntu-latest
            asset: highrise-linux.zip
    steps:
      - name: Checkout (with pygamine submodule)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up uv + Python
        # setup-uv publishes no floating major tag; pin an exact version.
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.12"

      - name: Install dependencies (incl. build group)
        run: uv sync --group build

      - name: Build bundle with PyInstaller
        env:
          # Headless build agents have no display/audio; keep SDL quiet.
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: uv run pyinstaller highrise.spec --noconfirm

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/highrise -DestinationPath ${{ matrix.asset }} -Force

      - name: Package (macOS)
        if: runner.os == 'macOS'
        # ditto preserves the .app bundle's symlinks/permissions (zip can mangle them).
        run: ditto -c -k --sequesterRsrc --keepParent "dist/Highrise.app" "${{ matrix.asset }}"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: cd dist && zip -r "../${{ matrix.asset }}" highrise

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7  # the GitHub Release keeps the builds; artifacts only hand them to the release job

  # The browser build is independent of the desktop jobs: if pygbag fails (it
  # needs internet), the desktop release and its itch.io pushes still go out.
  web:
    name: Build web (pygbag)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with pygamine submodule)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up uv + Python
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      # Stages the bundle and runs the pinned pygbag (needs internet);
      # the result is build/web with index.html at its root.
      - name: Build web bundle with pygbag
        run: uv run python scripts/build_web.py

      # itch.io's HTML5 limits for a zip upload (checked here so a too-big bundle fails
      # the build, not the push after the desktop builds went out). Source:
      # https://itch.io/docs/creators/html5 ("ZIP file requirements"): at most 1,000
      # files, 240 characters per file name including its path, 200 MB per extracted
      # file and 500 MB extracted in total. Update the numbers if that page changes.
      - name: Check the bundle against itch.io's HTML5 limits
        run: |
          max_files=1000
          max_name=240
          max_file_bytes=$((200 * 1024 * 1024))
          max_total_bytes=$((500 * 1024 * 1024))
          cd build/web
          files=$(find . -type f | wc -l)
          total=$(find . -type f -printf '%s\n' | awk '{s += $1} END {print s + 0}')
          fail=0
          if [ "$files" -gt "$max_files" ]; then
            echo "::error::Web bundle has $files files; itch.io allows at most $max_files."
            fail=1
          fi
          if [ "$total" -gt "$max_total_bytes" ]; then
            echo "::error::Web bundle is $total bytes extracted; itch.io allows at most $max_total_bytes."
            fail=1
          fi
          while IFS= read -r -d '' f; do
            name=${f#./}
            size=$(stat -c %s "$f")
            if [ "${#name}" -gt "$max_name" ]; then
              echo "::error::Web bundle file name is ${#name} characters (limit $max_name): $name"
              fail=1
            fi
            if [ "$size" -gt "$max_file_bytes" ]; then
              echo "::error::Web bundle file $name is $size bytes; itch.io allows at most $max_file_bytes per file."
              fail=1
            fi
          done < <(find . -type f -print0)
          echo "Web bundle: $files files, $total bytes extracted."
          exit $fail

      - name: Package
        run: cd build/web && zip -r ../../highrise-web.zip .

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          # Not "highrise-*": the desktop release jobs download that pattern.
          name: web-bundle
          path: highrise-web.zip
          if-no-files-found: error
          retention-days: 7  # the GitHub Release keeps the zip; the artifact only hands it to publish-web and attach-web

  # The Windows installer is a side build: it needs only the Windows zip (it runs even if the
  # macOS or Linux leg failed, and the artifact download fails it cleanly if that zip is missing),
  # and no release or itch.io job needs it, so an installer failure never blocks them. Its artifact is not named
  # highrise-*, so nothing that globs the zips picks it up.
  installer:
    name: Build the Windows installer (Inno Setup)
    needs: build
    if: ${{ !cancelled() }}  # codespell:ignore cancelled
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download the Windows build
        uses: actions/download-artifact@v8
        with:
          name: highrise-windows.zip
          path: artifacts

      - name: Unpack it to dist/ (what the installer script packs)
        shell: pwsh
        run: Expand-Archive artifacts/highrise-windows.zip -DestinationPath dist

      # Inno Setup is preinstalled on the Windows runners; install it only if it is missing.
      # The version is the tag's (without the "v") on a release, pyproject.toml's on a manual run.
      - name: Compile the installer
        shell: pwsh
        run: |
          $candidates = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe", "C:\Program Files\Inno Setup 6\ISCC.exe"
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --version 6.7.1 -y --no-progress
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw "ISCC.exe not found (looked in: $($candidates -join ', '))" }
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF_NAME.Substring(1)
          } else {
            $version = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          }
          & $iscc "/DAppVersion=$version" packaging/highrise.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Upload the installer
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: installer-out/highrise-windows-setup.exe
          if-no-files-found: error
          retention-days: 7  # the GitHub Release keeps the installer; the artifact only hands it to attach-installer

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download the desktop build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: highrise-*
          path: artifacts
          merge-multiple: true

      - name: Create release and attach bundles
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true

  publish-itch:
    name: Publish to itch.io
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download the desktop build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: highrise-*
          path: artifacts
          merge-multiple: true

      # butler diffs/patches at the file level, so unpack each zip rather than
      # pushing it as a single opaque file.
      - name: Unpack per-OS bundles
        run: |
          mkdir -p itch/windows itch/linux itch/osx
          unzip -q artifacts/highrise-windows.zip -d itch/windows
          unzip -q artifacts/highrise-linux.zip -d itch/linux
          unzip -q artifacts/highrise-macos.zip -d itch/osx

      - name: Push Windows build
        uses: yeslayla/butler-publish-itchio-action@v1.2.0
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_API_KEY }}
          ITCH_USER: umutcanekinci
          ITCH_GAME: highrise
          CHANNEL: windows
          VERSION: ${{ github.ref_name }}
          PACKAGE: itch/windows

      - name: Push Linux build
        uses: yeslayla/butler-publish-itchio-action@v1.2.0
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_API_KEY }}
          ITCH_USER: umutcanekinci
          ITCH_GAME: highrise
          CHANNEL: linux
          VERSION: ${{ github.ref_name }}
          PACKAGE: itch/linux

      - name: Push macOS build
        uses: yeslayla/butler-publish-itchio-action@v1.2.0
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_API_KEY }}
          ITCH_USER: umutcanekinci
          ITCH_GAME: highrise
          CHANNEL: osx
          VERSION: ${{ github.ref_name }}
          PACKAGE: itch/osx

  # itch.io publishing needs only the web build. The release attachment also waits
  # for the desktop release so an incomplete draft cannot be published accidentally.
  publish-web:
    name: Publish web build to itch.io
    needs: web
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download the web build artifact
        uses: actions/download-artifact@v8
        with:
          name: web-bundle
          path: artifacts

      # index.html sits at the zip's root, as itch.io expects; unpacked so
      # butler diffs at the file level.
      - name: Unpack web bundle
        run: |
          mkdir -p itch/web
          unzip -q artifacts/highrise-web.zip -d itch/web

      - name: Push web build
        uses: yeslayla/butler-publish-itchio-action@v1.2.0
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_API_KEY }}
          ITCH_USER: umutcanekinci
          ITCH_GAME: highrise
          CHANNEL: html5
          VERSION: ${{ github.ref_name }}
          PACKAGE: itch/web

  attach-web:
    name: Attach web build to the GitHub Release
    # Wait for the desktop release. A skipped release (failed desktop build) allows
    # a web-only release, but a failed release may have left an incomplete draft:
    # leave that draft untouched for retry instead of publishing it.
    needs: [web, release]
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.web.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped') }}  # codespell:ignore cancelled
    steps:
      - name: Download the web build artifact
        uses: actions/download-artifact@v8
        with:
          name: web-bundle
          path: artifacts

      - name: Attach the web bundle to the GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/highrise-web.zip
          fail_on_unmatched_files: true

  # Runs only after `release` succeeded, so it never creates a release on its own (the two
  # never race), and needs the installer, never the other desktop jobs.
  attach-installer:
    name: Attach the installer to the GitHub Release
    needs: [installer, release]
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.installer.result == 'success' && needs.release.result == 'success' }}  # codespell:ignore cancelled
    steps:
      - name: Download the installer artifact
        uses: actions/download-artifact@v8
        with:
          name: windows-installer
          path: artifacts

      - name: Attach the installer to the GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/highrise-windows-setup.exe
          fail_on_unmatched_files: true
